<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Usuario</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
  <div class="background">
    <div class="decorative-blur blur-tl"></div>
    <div class="decorative-blur blur-br"></div>

    <div class="card-container">
      <div class="card">

        <div class="card-header">
          <div class="icon-wrapper">
            <i class="bi bi-ticket-perforated icon-large"></i>
          </div>
          <h1 class="card-title">Registro de Usuario</h1>
          <p class="card-description">Crea tu cuenta para acceder a la plataforma</p>
        </div>

        <div class="card-content">
          <form id="registerForm" class="login-form">
            <div class="input-group">
              <label for="nombre">Nombre completo</label>
              <input type="text" id="nombre" placeholder="Ej: Juan Pérez" autocomplete="off" required />
            </div>

            <div class="input-group">
              <label for="email">Correo electrónico</label>
              <input type="email" id="email" placeholder="Ej: juan@email.com" autocomplete="off" required />
            </div>
            <div class="input-group">
              <label for="password">Contraseña</label>
              <div class="password-wrapper">
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="off" required />
                <button type="button" class="password-toggle" onclick="togglePassword('password', this)">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <p id="error" class="error-message hidden"></p>

            <button type="submit" class="register-button">
              <i class="fas fa-clipboard-list button-icon"></i>
              Registrarme
            </button>
          </form>

          <div class="card-footer-link">
            <div class="separator mt-4 mb-4">
              <span class="separator-text hidden"></span>
            </div>
            <p class="text-center">
              ¿Ya tenés cuenta?
              <a id="goLogin" href="../index.html" class="link-button">Volver al login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../config/env.js"></script>
  <script src="../scripts/utils.js"></script>
  <script src="../scripts/services/apiService.js"></script>
  <script src="../scripts/register.js" defer></script>
</body>

</html>
