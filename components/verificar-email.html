<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificar Email - Sistema de Tickets</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJDC+eXoKzI0gIzDQ1F8K1R+Y/8s/N4z8+rD2Y0X5V0gP1w=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <div class="background">
    <div class="decorative-blur blur-tl"></div>
    <div class="decorative-blur blur-br"></div>

    <div class="card-container">
      <div class="card">

        <div class="card-header">
          <div class="icon-wrapper">
            <i class="bi bi-envelope-check icon-large"></i>
          </div>
          <h1 class="card-title">Verificá tu email</h1>
          <p class="card-description">Ingresá el código de 6 dígitos que enviamos a tu correo</p>
        </div>

        <div class="card-content">
          <form id="verificarForm" class="login-form">
            <div class="input-group">
              <label for="email">Correo electrónico</label>
              <input type="email" id="email" placeholder="tu@email.com" autocomplete="off" required />
            </div>

            <div class="input-group">
              <label for="codigo">Código de verificación</label>
              <input type="text" id="codigo" placeholder="Ej: 123456" maxlength="6" autocomplete="off" required />
            </div>

            <p id="error" class="error-message hidden"></p>

            <button type="submit" class="login-button">
              <i class="fas fa-check-circle button-icon"></i>
              Verificar
            </button>

            <button type="button" id="reenviarBtn" class="register-button">
              <i class="fas fa-redo button-icon"></i>
              Reenviar código
            </button>
          </form>

          <div class="card-footer-link">
            <div class="separator mt-4 mb-4">
              <span class="separator-text hidden"></span>
            </div>
            <p class="text-center">
              <a id="goLogin" href="../index.html" class="link-button">Volver al login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>

  <script src="../lib/jquery/jquery-3.7.1.min.js"></script>
  <script src="../scripts/utils.js"></script>
  <script src="../scripts/verificar-email.js" defer></script>
</body>

</html>
